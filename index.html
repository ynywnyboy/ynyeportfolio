<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff5f7" />
    <title>Our Little World</title>
    <script>
      // Avoid any flash of the default look: restore a cached COPY of the last shared theme
      // (light/dark, accent palette, background, fonts, card style) before first paint.
      // The real, shared Supabase theme replaces it as soon as it loads.
      try {
        var root = document.documentElement;
        var c = JSON.parse(localStorage.getItem('olw-theme-cache') || 'null');
        if (c) {
          var dark = c.mode === 'dark' || (c.mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) root.classList.add('dark');
          var snap = c.snap;
          if (snap) {
            for (var k in snap.vars) root.style.setProperty(k, snap.vars[k]);
            for (var a in snap.attrs) root.setAttribute(a, snap.attrs[a]);
            (snap.links || []).forEach(function (href) {
              var l = document.createElement('link');
              l.rel = 'stylesheet'; l.href = href; l.setAttribute('data-olw-font', href);
              document.head.appendChild(l);
            });
          }
        }
        var p = JSON.parse(localStorage.getItem('olw-a11y') || 'null');
        var sys = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        root.setAttribute('data-reduce-motion', (sys || (p && p.reduceMotion)) ? 'on' : 'off');
      } catch (e) {}
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💞</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- Debug overlay: visible only when no-js-render has class removed; captures errors before React -->
    <div id="__debug-overlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;background:rgba(0,0,0,.85);color:#ff6b6b;font-family:monospace;font-size:13px;padding:20px;overflow:auto;">
      <div style="max-width:600px;margin:0 auto;">
        <h3 style="margin:0 0 10px;color:#fff">JS Boot Diagnostics</h3>
        <pre id="__debug-log" style="white-space:pre-wrap;word-break:break-all;margin:0;line-height:1.6;"></pre>
      </div>
    </div>
    <script>
      // Runs in plain JS BEFORE any module script — survives React crash.
      // Writes raw logs to localStorage under '__olw-debug-sid' so they persist across reloads.
      (function () {
        var sid = sessionStorage.getItem('__olw-debug-sid')
        if (!sid) {
          sid = Date.now().toString(36) + Math.random().toString(36).slice(2, 6)
          sessionStorage.setItem('__olw-debug-sid', sid)
        }
        var LOG_KEY = '__olw-debug-' + sid
        try { localStorage.removeItem(LOG_KEY) } catch (_) {}
        var buf = []
        function flush() {
          try { localStorage.setItem(LOG_KEY, JSON.stringify(buf)) } catch (_) {}
        }
        function stamp() { return '[' + performance.now().toFixed(1) + 'ms]' }
        // Patch console methods
        ;['log','warn','error','info'].forEach(function(m){
          var orig = console[m]
          console[m] = function(){ buf.push(stamp()+' '+Array.from(arguments).map(String).join(' ')); flush(); try{orig.apply(console,arguments)}catch(e){} }
        })
        // Capture network failures
        var origFetch = window.fetch
        window.fetch = function(url){
          buf.push(stamp()+' fetch('+String(url)+')'); flush()
          return origFetch.apply(this,arguments).catch(function(e){ buf.push(stamp()+' fetch err: '+e.message); flush(); throw e })
        }
        // Global JS errors
        window.addEventListener('error', function(e){
          buf.push(stamp()+' ERROR: '+e.message)
          if(e.error && e.error.stack) buf.push(e.error.stack)
          flush()
        })
        window.addEventListener('unhandledrejection', function(e){
          buf.push(stamp()+' REJECT: '+((e.reason&&e.reason.message)||String(e.reason)))
          flush()
        })
        // Show overlay if there were errors from this session
        setTimeout(function(){
          if(buf.length > 0){
            var el = document.getElementById('__debug-overlay')
            var pre = document.getElementById('__debug-log')
            if(el && pre){
              pre.textContent = buf.join('\n')
              el.style.display = 'block'
            }
          }
        }, 50)
        // Expose full buffer globally for later inspection
        window.__OLW_LOGS = buf
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
